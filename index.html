<div class="panel">

  <div class="panel-head">

    <h2 id="productFormTitle">
      إضافة منتوج جديد
    </h2>

  </div>

  <form id="productForm">

    <input type="hidden" id="productId">

    <div class="form-grid">

      <div class="field">
        <label>اسم المنتوج *</label>

        <input id="pName"
               required
               placeholder="مثال: سروال كلاس">
      </div>


      <div class="field">

        <label>الصنف *</label>

        <select id="pCategory" required>

          <option value="سراويل">سراويل</option>

          <option value="تيشورتات">
            تيشورتات
          </option>

          <option value="قمصان">
            قمصان
          </option>

          <option value="سبرديلات">
            سبرديلات
          </option>

          <option value="جاكيتات">
            جاكيتات
          </option>

          <option value="أخرى">
            أخرى
          </option>

        </select>

      </div>


      <div class="field">

        <label>ثمن الشراء</label>

        <input id="pCost"
               type="number"
               step="0.01"
               min="0"
               value="0">

      </div>


      <div class="field">

        <label>ثمن البيع</label>

        <input id="pPrice"
               type="number"
               step="0.01"
               min="0"
               value="0">

      </div>


      <div class="field">

        <label>الكمية</label>

        <input id="pQty"
               type="number"
               min="0"
               value="0">

      </div>


      <div class="field">

        <label>الحد الأدنى للمخزون</label>

        <input id="pMin"
               type="number"
               min="0"
               value="3">

      </div>

    </div>

    <br>

    <div class="actions">

      <button class="btn btn-primary"
              type="submit">
        حفظ المنتوج
      </button>

      <button class="btn btn-secondary"
              type="button"
              onclick="resetProductForm()">
        إلغاء
      </button>

    </div>

  </form>

</div>


<div class="panel">

  <div class="panel-head">

    <h2>المخزون</h2>

    <input id="productSearch"
           placeholder="بحث عن منتوج..."
           oninput="renderProducts()">

  </div>

  <div class="table-wrap">

    <table>

      <thead>

        <tr>
          <th>المنتوج</th>
          <th>الصنف</th>
          <th>الشراء</th>
          <th>البيع</th>
          <th>الكمية</th>
          <th>قيمة المخزون</th>
          <th>الحالة</th>
          <th>إجراء</th>
        </tr>

      </thead>

      <tbody id="productsTable"></tbody>

    </table>

  </div>

</div>
