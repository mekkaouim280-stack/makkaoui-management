<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Makkaoui Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:#0f2f5f;
  color:white;
  position:fixed;
  top:0;
  right:0;
  bottom:0;
  z-index:100;
  overflow-y:auto;
}

.logo{
  padding:25px 20px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.logo h1{
  font-size:25px;
  margin-bottom:6px;
}

.logo p{
  font-size:12px;
  opacity:.7;
}

.nav{
  padding:15px 10px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:white;
  text-align:right;
  padding:13px 15px;
  margin-bottom:5px;
  border-radius:10px;
  font-size:15px;
}

.nav button:hover,
.nav button.active{
  background:#174982;
}

/* MAIN */
.main{
  width:calc(100% - 250px);
  margin-right:250px;
  padding:25px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
  gap:15px;
}

.topbar h2{
  font-size:25px;
}

.mobile-menu{
  display:none;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.card-title{
  color:#718096;
  font-size:14px;
  margin-bottom:10px;
}

.card-value{
  font-size:25px;
  font-weight:bold;
}

.card small{
  display:block;
  margin-top:7px;
  color:#718096;
}
.cards .card:nth-child(1){
  background:#15803d;
  color:white;
}

.cards .card:nth-child(2){
  background:#1d4ed8;
  color:white;
}

.car
